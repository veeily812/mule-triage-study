<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert Triage Study</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e2e1dc;--accent:#2f5bd3;--up:#b3261e;--down:#1f7a4d;--in:#2f5bd3;--out:#c25e00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#a3a29b;--line:#36352f;--accent:#7a9bff;--up:#ff8a80;--down:#6fd3a0;--in:#7a9bff;--out:#ffb366}}
:root[data-theme="dark"]{--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#a3a29b;--line:#36352f;--accent:#7a9bff;--up:#ff8a80;--down:#6fd3a0;--in:#7a9bff;--out:#ffb366}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 8px}h2{font-size:17px;margin:0 0 8px}.muted{color:var(--muted)}
.risk{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
ul.reasons{list-style:none;padding:0;margin:8px 0}ul.reasons li{padding:6px 0;border-top:1px solid var(--line)}
.tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin-right:8px;border:1px solid currentColor;white-space:nowrap}
.tag.up{color:var(--up)}.tag.down{color:var(--down)}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.sel{background:var(--accent);border-color:var(--accent);color:#fff}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:12px}.lang button{padding:4px 12px;font-size:14px}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
table.tx{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.tx th,table.tx td{text-align:left;padding:4px 6px;border-top:1px solid var(--line)}table.tx .num{text-align:right}
.txwrap{max-height:280px;overflow:auto}
svg{width:100%;height:auto}svg text{fill:var(--ink);font-size:11px}.progress{font-size:14px;color:var(--muted)}
</style>
</head>

const app = document.getElementById("app");
let state = {lang: "en", pid: null, blocks: [], b: 0, i: 0, log: [], choice: null, conf: null, t0: 0, tDecide: null};
const T = () => STR[state.lang];

function save(){ try{ localStorage.setItem(KEY+":"+state.pid, JSON.stringify(state.log)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(v){ return "$"+Math.round(v).toLocaleString(T().locale); }

function setLang(l){
  state.lang = l;
  document.documentElement.lang = l;
  document.title = T().title;
}

function start(){
  const t = T();
  app.innerHTML = `<div class="lang"><button data-l="en" class="${state.lang==="en"?"sel":""}">English</button><button data-l="vi" class="${state.lang==="vi"?"sel":""}">Tiếng Việt</button></div>
  <div class="panel"><h1>${t.title}</h1><p>${t.intro}</p>
  <p><label>${t.pid} <input id="pid" autocomplete="off" value="${esc(state.pid || "")}"></label></p>
  <p><label><input type="checkbox" id="consent"> ${t.consent}</label></p>
  <button class="primary" id="go">${t.cont}</button></div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ state.pid = document.getElementById("pid").value.trim(); setLang(b.dataset.l); start(); });
  document.getElementById("go").onclick = ()=>{
    const pid = document.getElementById("pid").value.trim();
    if(!/^P\d{1,3}$/i.test(pid)){ alert(t.badPid); return; }
    if(!document.getElementById("consent").checked){ alert(t.needConsent); return; }
    state.pid = pid.toUpperCase();
    const odd = parseInt(state.pid.slice(1),10) % 2 === 1;  // counterbalancing: odd codes start with set A, no explanations
    if(odd !== (GROUP === "odd")){ alert(t.wrongLink(GROUP)); return; }
    const A = CARDS.filter(c=>c.set==="A"), B = CARDS.filter(c=>c.set==="B");
    state.blocks = odd ? [{cards:A, cond:"C0"},{cards:B, cond:"C1"}] : [{cards:B, cond:"C0"},{cards:A, cond:"C1"}];
    briefing();
  };
}

function briefing(){
  const t = T();
  app.innerHTML = `<div class="panel"><h1>${t.briefing}</h1><p>${t.mule}</p>
  <h2>${t.example}</h2><p class="muted">${t.exampleText}</p><p>${t.rankNote}</p>
  <button class="primary" id="go">${t.start1}</button></div>`;
  document.getElementById("go").onclick = ()=>{ state.b=0; state.i=0; show(); };
}

function txTable(c){
  const t = T();
  return `<div class="txwrap"><table class="tx"><thead><tr>${t.th.map((h,k)=>`<th${k===3?' class="num"':""}>${h}</th>`).join("")}</tr></thead><tbody>${
    c.transactions.map(x=>`<tr><td>${x.time}</td><td>${x.dir==="in"?t.received:t.sent}</td><td>${esc(x.cp)}</td><td class="num">${money(x.amount)}</td><td>${esc(t.currencies[x.currency]||x.currency)}</td><td>${esc(t.formats[x.format]||x.format)}</td></tr>`).join("")
  }</tbody></table></div>${c.more_transactions?`<p class="muted" style="font-size:13px">${t.moreTx(c.more_transactions)}</p>`:""}`;
}

function graph(c){
  const n = c.edges.length, W=520, H=320, cx=W/2, cy=H/2, R=120;
  const max = Math.max(...c.edges.map(e=>e.amount), 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T().graphLabel)}">
  <defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--in)"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--out)"/></marker></defs>`;
  c.edges.forEach((e,k)=>{
    const a = -Math.PI/2 + 2*Math.PI*k/Math.max(n,1), x = cx+R*Math.cos(a), y = cy+R*Math.sin(a);
    const w = 1 + 5*Math.sqrt(e.amount/max), inn = e.dir==="in";
    const [x1,y1,x2,y2] = inn ? [x,y,cx,cy] : [cx,cy,x,y];
    const sh = (p,q,f)=>p+(q-p)*f;
    s += `<line x1="${sh(x1,x2,.12)}" y1="${sh(y1,y2,.12)}" x2="${sh(x1,x2,.86)}" y2="${sh(y1,y2,.86)}" stroke="var(--${inn?"in":"out"})" stroke-width="${w}" marker-end="url(#a${inn?"i":"o"})"/>`;
    s += `<circle cx="${x}" cy="${y}" r="6" fill="var(--muted)"/><text x="${x}" y="${y+(y<cy?-12:20)}" text-anchor="middle">${esc(e.cp)} · ${money(e.amount)}</text>`;
  });
  s += `<circle cx="${cx}" cy="${cy}" r="14" fill="var(--accent)"/><text x="${cx}" y="${cy+32}" text-anchor="middle" font-weight="700">${esc(c.account)}</text></svg>`;
  return s + `<p class="muted" style="font-size:13px">${T().legend(c.hidden_edges)}</p>`;
}

function show(){
  const t = T(), blk = state.blocks[state.b], c = blk.cards[state.i];
  state.choice=null; state.conf=null; state.tDecide=null; state.t0=performance.now();
  const expl = blk.cond==="C1";
  app.innerHTML = `<div class="progress">${t.progress(state.b+1, state.i+1, blk.cards.length)}</div>
  <div class="panel"><div class="row"><div><div class="muted">${t.account}</div><h2>${esc(c.account)}</h2><div class="muted">${c.day}</div></div>
  <div><div class="muted">${t.rank}</div><div class="risk">#${c.rank} <span class="muted" style="font-size:16px;font-weight:400">${t.of100}</span></div></div></div>
  <h2 style="margin-top:12px">${t.txToday}</h2>${txTable(c)}
  ${expl ? `<h2 style="margin-top:12px">${t.why}</h2><ul class="reasons">${c.reasons.map(r=>`<li><span class="tag ${r.up?"up":"down"}">${r.up?t.up:t.down}</span>${esc(r.text[state.lang])}</li>`).join("")}</ul>
  <h2>${t.cpPicture}</h2>${graph(c)}` : ""}
  </div>
  <div class="panel"><h2>${t.decision}</h2>
  <div class="btns"><button data-d="escalate">${t.escalate}</button><button data-d="dismiss">${t.dismiss}</button></div>
  <div class="muted" style="margin-top:8px">${t.confidence}</div>
  <div class="btns" id="conf">${[1,2,3,4,5].map(v=>`<button data-c="${v}">${v}</button>`).join("")}</div>
  <button class="primary" id="next" disabled>${t.next}</button></div>`;
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ state.choice=b.dataset.d; state.tDecide=performance.now();
    app.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("sel",x===b)); ready(); });
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ state.conf=+b.dataset.c;
    app.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("sel",x===b)); ready(); });
  document.getElementById("next").onclick = record;
}
function ready(){ document.getElementById("next").disabled = !(state.choice && state.conf); }

function record(){
  const t = T(), blk = state.blocks[state.b], c = blk.cards[state.i];
  state.log.push({pid:state.pid, lang:state.lang, block:state.b+1, cond:blk.cond, set:c.set, card:c.id, decision:state.choice, confidence:state.conf,
    seconds_to_decision:+((state.tDecide-state.t0)/1000).toFixed(2), seconds_total:+((performance.now()-state.t0)/1000).toFixed(2),
    rank:c.rank, recorded_at:new Date().toISOString()});
  save();
  state.i++;
  if(state.i < blk.cards.length) return show();
  if(state.b===0){ state.b=1; state.i=0;
    app.innerHTML = `<div class="panel"><h1>${t.blockDone}</h1><p>${t.nextBlock(state.blocks[1].cond==="C1")}</p><button class="primary" id="go">${t.start2}</button></div>`;
    document.getElementById("go").onclick = show; return; }
  done();
}

function done(){
  const t = T(), blob = new Blob([JSON.stringify(state.log,null,1)],{type:"application/json"});
  app.innerHTML = `<div class="panel"><h1>${t.thanks}</h1><p>${t.thanksText}</p>
  <a download="study_${state.pid}.json" href="${URL.createObjectURL(blob)}"><button class="primary">${t.download}</button></a></div>`;
}

setLang((navigator.language||"en").toLowerCase().startsWith("vi") ? "vi" : "en");
start();
</script>
</body></html>
